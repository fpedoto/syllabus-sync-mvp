<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Career Closet | Pitch 2 live deck</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1520;color:#fff;font-family:Arial,Helvetica,sans-serif}
    main{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:18px}
    .stage{width:min(100%,calc((100vh - 110px)*16/9));aspect-ratio:16/9;background:#fff;box-shadow:0 16px 50px #0007}
    .stage img{display:block;width:100%;height:100%;object-fit:contain}
    nav{width:min(100%,calc((100vh - 110px)*16/9));display:flex;justify-content:space-between;align-items:center;gap:16px}
    button{font:inherit;border:1px solid #8594a3;background:#182d42;color:#fff;padding:9px 18px;border-radius:4px;cursor:pointer;min-width:92px}
    button:hover{background:#254e70}button:focus-visible{outline:3px solid #ddb56b;outline-offset:3px}button:disabled{opacity:.42;cursor:default}
    #count{font-weight:700}small{color:#c3ccd5}.left,.right{display:flex;align-items:center;gap:12px}
    @media(max-width:650px){main{padding:10px}.stage{width:100%}nav{width:100%}button{min-width:0;padding:9px 12px}small{display:none}}
  </style>
</head>
<body>
<main>
  <div class="stage"><img id="slide" src="slide-1.png" alt="Slide 1: Career Closet pitch title"></div>
  <nav aria-label="Slide navigation">
    <div class="left"><button id="prev" type="button" aria-label="Previous slide">Previous</button><span id="count" aria-live="polite">1 / 8</span></div>
    <small>Use arrow keys to advance. Press F for full screen.</small>
    <div class="right"><button id="fullscreen" type="button">Full screen</button><button id="next" type="button" aria-label="Next slide">Next</button></div>
  </nav>
</main>
<script>
  const descriptions=[
    'Career Closet pitch title',
    'Customer need and Ohio State alternative',
    'Live prototype request path and URL',
    'Customer evidence placeholders, to be completed with real tests',
    'Illustrative unit economics',
    'Bottom-up market capacity assumptions',
    'Illustrative valuation range and proposed terms',
    'Funding ask, use of funds, and pilot milestone'
  ];
  let current=0;const slide=document.getElementById('slide'),count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next');
  function show(index){current=Math.max(0,Math.min(7,index));slide.src=`slide-${current+1}.png`;slide.alt=`Slide ${current+1}: ${descriptions[current]}`;count.textContent=`${current+1} / 8`;prev.disabled=current===0;next.disabled=current===7;location.hash=`slide-${current+1}`}
  prev.addEventListener('click',()=>show(current-1));next.addEventListener('click',()=>show(current+1));
  document.getElementById('fullscreen').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()});
  document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home')show(0);if(e.key==='End')show(7);if(e.key.toLowerCase()==='f')document.getElementById('fullscreen').click()});
  const match=location.hash.match(/^#slide-([1-8])$/);show(match?Number(match[1])-1:0);
</script>
</body>
</html>
